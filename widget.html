<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Namello — ویجت سشن‌ها</title>
<meta name="theme-color" content="#0B0E11" />
<link rel="icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root { --scale: 1; }
  * { box-sizing: border-box; }
  html, body { background: #0B0E11; margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Vazirmatn', sans-serif; color: #E8EAED;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: calc(10px * var(--scale));
  }
  .card { width: 100%; max-width: calc(320px * var(--scale)); text-align: center; }
  .ring-wrap { position: relative; width: calc(46vw * var(--scale)); height: calc(46vw * var(--scale)); max-width: calc(220px * var(--scale)); max-height: calc(220px * var(--scale)); min-width: 110px; min-height: 110px; margin: 0 auto; }
  svg { width: 100%; height: 100%; display: block; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: calc(20px * var(--scale)); }
  .clock-time { font-family: 'JetBrains Mono', monospace; font-size: calc(13px * var(--scale)); color: #8B93A1; letter-spacing: 0.5px; }
  .focus-name { font-size: calc(11px * var(--scale)); color: #D4A64A; font-weight: 700; margin-top: 3px; text-align: center; line-height: 1.3; }
  .focus-countdown { font-family: 'JetBrains Mono', monospace; font-size: calc(16px * var(--scale)); font-weight: 700; color: #E8EAED; }
  .focus-sub { font-size: calc(9px * var(--scale)); color: #6B7280; }
  .legend { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: calc(10px * var(--scale)); }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: calc(10px * var(--scale)); padding: 3px 8px; border-radius: 999px; white-space: nowrap; background: #12161C; border: 1px solid #1F242C; }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: calc(10px * var(--scale)); }
  .chip { font-size: calc(11px * var(--scale)); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .empty { font-size: calc(11px * var(--scale)); color: #6B7280; }
  .sizebar { position: fixed; top: 8px; left: 8px; display: flex; gap: 4px; opacity: 0.55; }
  .sizebar button { width: 24px; height: 24px; border-radius: 6px; background: #12161C; border: 1px solid #1F242C; color: #8B93A1; font-size: 12px; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: calc(8px * var(--scale)); opacity: 0.85; }
  .logo-dot { width: 6px; height: 6px; border-radius: 50%; background: #D4A64A; }
  .logo-text { font-size: calc(11px * var(--scale)); color: #6B7280; }
</style>
</head>
<body>
  <div class="sizebar">
    <button id="szDown" aria-label="کوچک‌تر">−</button>
    <button id="szUp" aria-label="بزرگ‌تر">+</button>
  </div>
  <div class="card">
    <div class="logo-row"><span class="logo-dot"></span><span class="logo-text">Namello</span></div>
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120" id="sessionSvg"></svg>
      <div class="ring-center">
        <div class="clock-time" id="nyClock">--:--:--</div>
        <div class="focus-name" id="focusName">—</div>
        <div class="focus-countdown" id="focusCountdown">--:--:--</div>
        <div class="focus-sub" id="focusSub"></div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chips" id="chips"></div>
  </div>

<script>
/* این صفحه، نسخه‌ی مستقل و سبکِ Namello است که نشست‌های معاملاتی (سیدنی/توکیو/لندن/نیویورک) را
   به‌صورت قطاع‌های رنگی روی یک دایره‌ی چندلایه (هر نشست یک حلقه‌ی مخصوص خودش) نشان می‌دهد؛ یک خط
   شعاعی هم موقعیت لحظه‌ای زمان نیویورک را نشان می‌دهد و کیل‌زون‌ها/سیلور بولت‌ها با یک تیک کوچک
   روی لبه‌ی بیرونی مشخص شده‌اند. چون یک ویجتِ واقعیِ صفحه‌ی اصلیِ اندروید فقط با کد نیتیو
   (Kotlin/AppWidgetProvider) ساخته می‌شود و از دل HTML/CSS/JS قابل‌ساخت نیست، این صفحه نزدیک‌ترین
   معادلِ قابل‌ساخت از دل وب است: می‌شه بازش کرد، به هوم‌اسکرین میان‌بر زد، یا داخل اپ‌های «ویجت
   وب» (مثل KWGT) به آدرسش لینک داد. تنظیمات سشن‌ها را از همان حافظه‌ی محلیِ برنامه‌ی اصلی
   (در همین دامنه/PWA) می‌خواند تا با Namello هماهنگ بماند.

   NOTE: This is a lightweight, dependency-free reflection of the active trading sessions from the
   main Namello app, drawn as colored sector arcs on a multi-ring circle. A real Android home-screen
   widget cannot be built from HTML/JS — it requires native code (Kotlin/Java + AppWidgetProvider). */

function pad2(n) { return String(n).padStart(2, "0"); }

function getNYNow() {
  const now = new Date();
  const dtf = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  const parts = {};
  dtf.formatToParts(now).forEach(p => { parts[p.type] = p.value; });
  let hh = parseInt(parts.hour, 10); if (hh === 24) hh = 0;
  const mi = parseInt(parts.minute, 10), ss = parseInt(parts.second, 10);
  const tzName = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", timeZoneName: "short" })
    .formatToParts(now).find(p => p.type === "timeZoneName");
  const dst = tzName && tzName.value === "EDT";
  return { hh, mi, ss, minutesOfDay: hh * 60 + mi, dst };
}

const DEFAULT_CONFIG = {
  sessions: [
    { key: "sydney", name: "سشن سیدنی", color: "#22C55E", dst: { s: [18, 0], e: [3, 0] }, std: { s: [17, 0], e: [2, 0] } },
    { key: "tokyo", name: "سشن توکیو (آسیا)", color: "#F59E0B", dst: { s: [20, 0], e: [5, 0] }, std: { s: [19, 0], e: [4, 0] } },
    { key: "london", name: "سشن لندن", color: "#3B82F6", dst: { s: [4, 0], e: [13, 0] }, std: { s: [3, 0], e: [12, 0] } },
    { key: "newyork", name: "سشن نیویورک", color: "#A855F7", dst: { s: [9, 0], e: [18, 0] }, std: { s: [8, 0], e: [17, 0] } },
  ],
  killzones: [
    { key: "asiakz", name: "کیل‌زون آسیا", color: "#39FF6E", dst: { s: [21, 0], e: [1, 0] }, std: { s: [20, 0], e: [0, 0] } },
    { key: "londonkz", name: "کیل‌زون لندن", color: "#39FF6E", dst: { s: [3, 0], e: [6, 0] }, std: { s: [2, 0], e: [5, 0] } },
    { key: "nykz", name: "کیل‌زون نیویورک", color: "#39FF6E", dst: { s: [9, 30], e: [12, 0] }, std: { s: [8, 30], e: [11, 0] } },
    { key: "otemorning", name: "الگوی نقطه بهینه ورود (OTE) صبح نیویورک", color: "#22D3EE", dst: { s: [8, 30], e: [12, 0] }, std: { s: [7, 30], e: [11, 0] } },
    { key: "londonclosekz", name: "کیل‌زون بسته‌شدن لندن", color: "#39FF6E", dst: { s: [14, 30], e: [17, 0] }, std: { s: [13, 30], e: [16, 0] } },
  ],
  silverbullets: [
    { key: "sb1", name: "سیلور بولت (اول)", color: "#FDBA74", dst: { s: [4, 0], e: [5, 0] }, std: { s: [3, 0], e: [4, 0] } },
    { key: "sb2", name: "سیلور بولت (دوم)", color: "#FDBA74", dst: { s: [11, 0], e: [12, 0] }, std: { s: [10, 0], e: [11, 0] } },
    { key: "sb3", name: "سیلور بولت (سوم)", color: "#FDBA74", dst: { s: [15, 0], e: [16, 0] }, std: { s: [14, 0], e: [15, 0] } },
  ],
};

function loadConfig() {
  try {
    const raw = localStorage.getItem("ns_namello_session_config_v3");
    if (!raw) return DEFAULT_CONFIG;
    const saved = JSON.parse(raw);
    const mergeCat = (cat) => [
      ...(DEFAULT_CONFIG[cat] || []).map(def => {
        const found = Array.isArray(saved[cat]) ? saved[cat].find(x => x && x.key === def.key) : null;
        return found ? { ...def, ...found } : def;
      }),
      ...(Array.isArray(saved[cat]) ? saved[cat].filter(x => x && x.custom && x.key && x.dst && x.std) : []),
    ];
    return { sessions: mergeCat("sessions"), killzones: mergeCat("killzones"), silverbullets: mergeCat("silverbullets") };
  } catch (e) { return DEFAULT_CONFIG; }
}

function toMin(arr) { return arr[0] * 60 + arr[1]; }
function evalEvent(ev, minutesOfDay, dst) {
  const t = dst ? ev.dst : ev.std;
  const startMin = toMin(t.s), endMin = toMin(t.e);
  const wrap = endMin <= startMin;
  const duration = wrap ? endMin + 1440 - startMin : endMin - startMin;
  const active = wrap ? (minutesOfDay >= startMin || minutesOfDay < endMin) : (minutesOfDay >= startMin && minutesOfDay < endMin);
  let remaining, progress, untilStart;
  if (active) {
    remaining = wrap ? (((endMin - minutesOfDay) + 1440) % 1440) || duration : endMin - minutesOfDay;
    if (remaining <= 0) remaining += 1440;
    progress = Math.max(0, Math.min(1, (duration - remaining) / duration));
    untilStart = 0;
  } else {
    untilStart = (startMin - minutesOfDay + 1440) % 1440;
    remaining = 0; progress = 0;
  }
  return { ...ev, startMin, duration, active, remaining, progress, untilStart };
}
function fmtDur(min) {
  min = Math.max(0, Math.round(min));
  const h = Math.floor(min / 60), m = min % 60;
  return `${pad2(h)}:${pad2(m)}:00`;
}

/* ---------------- ریاضیِ رسم قطاع روی دایره (۰ دقیقه = بالای دایره، ساعت‌گرد) ---------------- */
const SVG_NS = "http://www.w3.org/2000/svg";
function polarToXY(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function arcPath(cx, cy, r, startDeg, endDeg) {
  let sweep = endDeg - startDeg;
  if (sweep <= 0) sweep += 360;
  if (sweep >= 359.99) sweep = 359.99; // جلوگیری از دایره‌ی کامل که SVG آرک را اشتباه رسم می‌کند
  const end = startDeg + sweep;
  const p0 = polarToXY(cx, cy, r, startDeg);
  const p1 = polarToXY(cx, cy, r, end);
  const largeArc = sweep > 180 ? 1 : 0;
  return `M ${p0.x} ${p0.y} A ${r} ${r} 0 ${largeArc} 1 ${p1.x} ${p1.y}`;
}
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
  return el;
}

const CX = 60, CY = 60;
const RING_STROKE = 7;
// از بیرون به داخل: سیدنی، توکیو، لندن، نیویورک
const RING_DEFS = [
  { key: "sydney", r: 54 },
  { key: "tokyo", r: 45 },
  { key: "london", r: 36 },
  { key: "newyork", r: 27 },
];

const svgRoot = document.getElementById("sessionSvg");
const nyClockEl = document.getElementById("nyClock");
const focusNameEl = document.getElementById("focusName");
const focusCountdownEl = document.getElementById("focusCountdown");
const focusSubEl = document.getElementById("focusSub");
const chipsEl = document.getElementById("chips");
const legendEl = document.getElementById("legend");

let legendBuilt = false;
function buildLegend(sessions) {
  if (legendBuilt) return;
  legendBuilt = true;
  legendEl.innerHTML = "";
  sessions.forEach(s => {
    const item = document.createElement("span");
    item.className = "legend-item";
    const dot = document.createElement("span");
    dot.className = "legend-dot";
    dot.style.background = s.color || "#D4A64A";
    item.appendChild(dot);
    item.appendChild(document.createTextNode(s.name.replace("سشن ", "")));
    legendEl.appendChild(item);
  });
}

function drawSessionRings(sessions, minutesOfDay, dst) {
  svgRoot.innerHTML = "";
  RING_DEFS.forEach(def => {
    const s = sessions.find(x => x.key === def.key);
    if (!s) return;
    const ev = evalEvent(s, minutesOfDay, dst);
    const startDeg = (ev.startMin / 1440) * 360;
    const endDeg = startDeg + (ev.duration / 1440) * 360;
    const color = s.color || "#D4A64A";
    // حلقه‌ی زمینه (کم‌رنگ، کامل)
    svgRoot.appendChild(svgEl("circle", {
      cx: CX, cy: CY, r: def.r, fill: "none", stroke: color, "stroke-opacity": 0.08, "stroke-width": RING_STROKE,
    }));
    // قطاعِ بازه‌ی زمانیِ همین نشست
    svgRoot.appendChild(svgEl("path", {
      d: arcPath(CX, CY, def.r, startDeg, endDeg),
      fill: "none", stroke: color, "stroke-width": RING_STROKE, "stroke-linecap": "round",
      "stroke-opacity": ev.active ? 1 : 0.38,
    }));
  });
}

function drawEdgeTicks(events) {
  const rOuter = 60, rInner = 57.5;
  events.forEach(ev => {
    const deg = (ev.startMin / 1440) * 360;
    const p0 = polarToXY(CX, CY, rInner, deg);
    const p1 = polarToXY(CX, CY, rOuter, deg);
    svgRoot.appendChild(svgEl("line", {
      x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y,
      stroke: ev.color || "#39FF6E", "stroke-width": ev.active ? 2.4 : 1.2,
      "stroke-opacity": ev.active ? 1 : 0.55, "stroke-linecap": "round",
    }));
  });
}

function drawNowMarker(minutesOfDay, seconds) {
  const preciseMin = minutesOfDay + seconds / 60;
  const deg = (preciseMin / 1440) * 360;
  const p0 = polarToXY(CX, CY, 21, deg);
  const p1 = polarToXY(CX, CY, 58.5, deg);
  svgRoot.appendChild(svgEl("line", {
    x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y,
    stroke: "#E8EAED", "stroke-width": 1.3, "stroke-opacity": 0.9,
  }));
  const tip = polarToXY(CX, CY, 58.5, deg);
  svgRoot.appendChild(svgEl("circle", { cx: tip.x, cy: tip.y, r: 2.1, fill: "#E8EAED" }));
}

function tick() {
  const now = getNYNow();
  nyClockEl.textContent = `${pad2(now.hh)}:${pad2(now.mi)}:${pad2(now.ss)} NY`;

  const config = loadConfig();
  buildLegend(config.sessions);

  const sessionsEval = config.sessions.map(e => ({ ...evalEvent(e, now.minutesOfDay, now.dst), kind: "سشن" }));
  const kzEval = config.killzones.map(e => ({ ...evalEvent(e, now.minutesOfDay, now.dst), kind: "کیل‌زون" }));
  const sbEval = config.silverbullets.map(e => ({ ...evalEvent(e, now.minutesOfDay, now.dst), kind: "سیلور بولت" }));
  const all = [...sessionsEval, ...kzEval, ...sbEval];

  drawSessionRings(config.sessions, now.minutesOfDay, now.dst);
  drawEdgeTicks([...kzEval, ...sbEval]);
  drawNowMarker(now.minutesOfDay, now.ss);

  // اولویتِ نمایش در مرکز: کیل‌زون/سیلور بولتِ فعال (چون بازه‌ی کوتاه‌تر و حساس‌تری دارن)، بعد سشن‌ها
  const activeSessions = sessionsEval.filter(e => e.active);
  const activeNarrow = [...kzEval, ...sbEval].filter(e => e.active).sort((a, b) => a.remaining - b.remaining);
  const focus = activeNarrow[0] || activeSessions.slice().sort((a, b) => a.remaining - b.remaining)[0]
    || all.slice().sort((a, b) => a.untilStart - b.untilStart)[0];

  if (focus) {
    if (focus.active) {
      const secLeft = focus.remaining * 60 - now.ss;
      focusNameEl.textContent = focus.name;
      focusCountdownEl.textContent = fmtDur(secLeft / 60);
      focusSubEl.textContent = activeNarrow[0]
        ? `${focus.kind} فعال — تا پایان`
        : (activeSessions.length > 1 ? `${activeSessions.length} نشست هم‌زمان فعال — تا پایانِ نزدیک‌ترین` : `${focus.kind} فعال — تا پایان`);
    } else {
      const secLeft = focus.untilStart * 60 - now.ss;
      focusNameEl.textContent = focus.name;
      focusCountdownEl.textContent = fmtDur(secLeft / 60);
      focusSubEl.textContent = `${focus.kind} — تا شروع`;
    }
  }

  chipsEl.innerHTML = "";
  const activeEvents = all.filter(e => e.active).sort((a, b) => a.remaining - b.remaining);
  if (activeEvents.length) {
    activeEvents.forEach(e => {
      const span = document.createElement("span");
      span.className = "chip";
      span.style.background = (e.color || "#D4A64A") + "33";
      span.style.color = e.color || "#D4A64A";
      span.textContent = e.name;
      chipsEl.appendChild(span);
    });
  } else {
    const span = document.createElement("span");
    span.className = "empty";
    span.textContent = "در حال حاضر هیچ سشن/کیل‌زونی فعال نیست";
    chipsEl.appendChild(span);
  }
}

tick();
setInterval(tick, 1000);

/* اندازه‌ی ویجت */
const SIZE_KEY = "ns_namello_widget_settings_v1";
function loadSize() {
  try {
    const raw = localStorage.getItem(SIZE_KEY);
    if (raw) return (JSON.parse(raw).sizeLevel) || 2;
  } catch (e) {}
  return 2;
}
function applySize(level) {
  const scale = level === 1 ? 0.72 : level === 3 ? 1.35 : 1;
  document.documentElement.style.setProperty("--scale", scale);
  try { localStorage.setItem(SIZE_KEY, JSON.stringify({ sizeLevel: level })); } catch (e) {}
  return level;
}
let sizeLevel = applySize(loadSize());
document.getElementById("szUp").onclick = () => { sizeLevel = applySize(Math.min(3, sizeLevel + 1)); };
document.getElementById("szDown").onclick = () => { sizeLevel = applySize(Math.max(1, sizeLevel - 1)); };
</script>
</body>
</html>
