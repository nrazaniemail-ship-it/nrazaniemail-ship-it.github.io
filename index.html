<script>
  function showBootError(title, detail) {
    var el = document.getElementById('boot-error');
    var status = document.getElementById('boot-status');
    if (status) status.style.display = 'none';
    if (!el) return;
    el.style.display = 'block';
    el.textContent = '⚠ ' + title + '\n\n' + (detail || '') + '\n\n---\nPlease screenshot this and send it back.';
  }
  window.addEventListener('error', function (e) {
    var msg = e.message || (e.error && e.error.message) || 'Unknown error';
    var src = e.filename ? (' at ' + e.filename + ':' + e.lineno + ':' + e.colno) : '';
    showBootError('Script error', msg + src);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('Unhandled promise rejection', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
  });

  window.storage = {
    async get(key) {
      const raw = localStorage.getItem('ns_' + key);
      if (raw === null) throw new Error('not found');
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem('ns_' + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem('ns_' + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('ns_' + (prefix || ''))) keys.push(k.slice(3));
      }
      return { keys, shared: false };
    },
  };
</script>

                gain.connect(ctx.destination);
                osc.start(now0 + offset);
                osc.stop(now0 + offset + 0.2);

        // eslint-disable-next-line no-new-func
